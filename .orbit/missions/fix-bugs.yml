name: fix-bugs
tags:
  - eval
  - smoke

# Prompts — read inside the sandbox at the start of each role's task.
# Paths are relative to the project workdir. The base prompt (optional)
# is prepended to both work and review.
prompts:
  work: .orbit/prompts/work.md
  review: .orbit/prompts/review.md

# Halt thresholds.
#
# `task_failures` ticks every time a task's exit code is non-zero. For
# fix-bugs, that's *every* cycle until pytest passes — so the bound has
# to leave room for one cycle per bug. 4 bugs × 2 tasks/cycle = 8 + a
# little headroom for a retry per priority = 10.
halt_on_consecutive_regressions: 2
halt_on_consecutive_task_failures: 10

# stop_after omitted on purpose — pass --stop-after HH:MM at the CLI
# so the smoke can pick a near-future wall-clock without re-pushing.

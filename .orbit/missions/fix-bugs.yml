name: fix-bugs
tags:
  - eval
  - smoke

# Prompts — read inside the sandbox at the start of each role's task.
# Paths are relative to the project workdir. The base prompt (optional)
# is prepended to both work and review.
prompts:
  work: .orbit/prompts/work.md
  review: .orbit/prompts/review.md

# Halt thresholds.
#
# Both regressions and task_failures tick every cycle the oracle isn't
# clean, regardless of whether the agent made progress. For fix-bugs,
# that's *every* cycle until pytest passes — so both bounds need
# headroom for one cycle per bug + retries.
# 4 bugs × 2 tasks/cycle = 8 + a couple of retries = 10. Apply the
# same bound to both counters.
halt_on_consecutive_regressions: 10
halt_on_consecutive_task_failures: 10

# stop_after omitted on purpose — pass --stop-after HH:MM at the CLI
# so the smoke can pick a near-future wall-clock without re-pushing.
